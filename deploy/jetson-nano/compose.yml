services:
  anpr:
    image: ghcr.io/himanshu-parksmart/parksmart-anpr:jetson-nano-jp441-latest
    pull_policy: always
    runtime: nvidia
    # The image runs as UID 10001. Grant access to Jetson GPU device nodes,
    # which are owned by the host's video group (GID 44 on JetPack 4.x).
    group_add:
      - "44"
    restart: unless-stopped
    environment:
      # RTSP URLs are comma-separated. A single value in the other fields is
      # reused for every camera; use comma-separated values to override each.
      RTSP_URLS: "${RTSP_URLS:-rtsp://admin:admin123@192.168.220.154:554/avstream/channel=1/stream=0.sdp}"
      SERVER_URLS: "127.0.0.1"
      PORTS: "9898"
      LOG_TYPES: "ENTRY"
      DESCRIPTIONS: "Gate 2"
      RELAYS: "-1"
      CHARSET: "latin"
      PARALLEL: "false"
      # The gate camera is mounted at an angle; rectify the detected plate
      # before OCR so slanted registrations remain readable.
      RECTIFY: "true"
      SHOW_FRAME: "false"
      USE_PIPELINE: "false"
      TENSORRT_ENABLED: "true"
      NPU_ENABLED: "false"
      OPENVINO_ENABLED: "false"
      WINDOW_PREFIX: "Grandthum"
      ENCODING: "H264"
      MIN_CONFIDENCE: "40"
      # Keep the hardware-bound SDK token outside version control. Put
      # TOKEN_DATA=<token> in deploy/jetson-nano/.env on the controller.
      TOKEN_DATA: "${TOKEN_DATA:-}"
      TOKEN_FILE: "${TOKEN_FILE:-}"
      GPIO_PIN: ""
      DEFAULT_GPIO_LEVEL: ""
    network_mode: host
    volumes:
      - /run/udev:/run/udev:ro
      - /dev:/dev:ro
      - /home/parksmart/anpr/images:/home/parksmart/anpr/images
      - ../../assets/models.tensorrt/optimized:/opt/ultimatealpr/assets/models.tensorrt/optimized:ro
    logging:
      driver: local
      options:
        max-size: 3m
        max-file: "10"

