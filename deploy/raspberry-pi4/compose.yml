services:
  anpr:
    image: ghcr.io/parksmart-tech/parksmart-anpr:rpi-latest
    pull_policy: always
    platform: linux/arm/v7
    restart: unless-stopped
    environment:
      # RTSP URLs are comma-separated. A single value in the other fields is
      # reused for every camera; use comma-separated values to override each.
      RTSP_URLS: ""
      SERVER_URLS: ""
      PORTS: ""
      LOG_TYPES: ""
      DESCRIPTIONS: ""
      RELAYS: ""
      TOKEN_DATA: ""
      # The Pi image must not enable accelerators unavailable on ARMv7.
      TENSORRT_ENABLED: "false"
    network_mode: host
    volumes:
      - /run/udev:/run/udev:ro
      - /dev:/dev:ro
      - /home/parksmart/anpr/images:/home/parksmart/anpr/images
    logging:
      driver: local
      options:
        max-size: 3m
        max-file: "10"
